configuration:
  log_level:
    name: Log level
    description: >-
      Controls the verbosity of the add-on's own log output. This does not
      affect the log level of the firmware on your devices, which is set per
      device when you create it.
  mqtt_export:
    name: Publish rooms and zones to Home Assistant
    description: >-
      Creates one Home Assistant device per room, with an occupancy
      binary_sensor and a person count, and another pair per detection
      zone, over MQTT discovery. Needs a broker such as the Mosquitto
      add-on; without one the add-on runs normally and rooms stay visible
      only in this interface.
network: {}
