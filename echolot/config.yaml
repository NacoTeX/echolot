name: Echolot
version: "0.12.6"
slug: echolot
description: >-
  Self-hosted Wi-Fi CSI presence detection hub built on ESPectre — a
  license-free, open-source alternative to TOMMY.
url: "https://github.com/NacoTeX/claudeandI/tree/main/echolot"
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
# Supervisor API: needed to look up the managed MQTT broker.
hassio_api: true
# Zones are published to Home Assistant over MQTT when a broker exists;
# 'want' means the add-on still starts fine without one.
services:
  - mqtt:want
ingress: true
ingress_port: 8099
panel_icon: mdi:radar
panel_title: Echolot
webui: "http://[HOST]:[PORT:8099]/"
startup: application
boot: auto
options:
  log_level: info
  mqtt_export: true
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  mqtt_export: bool
