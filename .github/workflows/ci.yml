name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` as well as the defaults, or the `firmware` label below
    # would be a mechanism that never fires: a label change does not
    # produce opened/synchronize/reopened, so the compile job could only
    # ever run after a merge. The label is the documented way to ask for
    # it on a pull request, so it has to start a run.
    types: [opened, synchronize, reopened, labeled]

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # The runtime set, not a reduced one: installing what actually
        # ships is how the paho-mqtt/ESPHome version conflict was caught
        # before it reached a user.
        run: pip install -r echolot/app/requirements.txt -r echolot/requirements-dev.txt
      - name: Run tests
        run: python -m pytest echolot/tests -q

  firmware-config:
    name: Firmware config validates for every board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r echolot/app/requirements.txt
      # Renders the real template for every board in the registry and runs
      # `esphome config` over each, which also validates the schema of the
      # echolot_ld2460 component. Shipped bugs have come from firmware YAML
      # that was never validated: ota.esp32, cpu_frequency on the C3.
      - name: Validate generated firmware configs
        run: python echolot/tools/validate_firmware.py

  addon-metadata:
    name: Add-on metadata is well-formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Check config.yaml, build.yaml and repository.yaml
        run: python echolot/tools/check_metadata.py

  frontend:
    name: Browser scripts parse and their logic holds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The UI is plain scripts with no build step, so nothing else would
      # notice a syntax error before it reached the browser.
      - name: Parse every script
        run: |
          for f in echolot/app/static/*.js; do node --check "$f"; done
      # flash_watch.js decides which advice a stalled flash gets. Getting
      # that backwards sends someone to the wrong half of the problem.
      - name: Flash-step logic
        run: node echolot/tools/test_flash_watch.js

  firmware-compile:
    name: Firmware links on real toolchains
    runs-on: ubuntu-latest
    # `esphome config` catches a YAML mistake in seconds and catches
    # nothing else. It does not run a compiler, and it cannot tell you
    # that the pinned ESPHome and Echolot's own echolot_ld2460 component
    # disagree about a header — the failure that reaches a user as a
    # twenty-minute build ending in a C++ error they did not write. So
    # real images are linked: the classic ESP32 for Xtensa, and the C5 —
    # the board the radar runs on, the only dual-band chip and the only
    # one whose `wifi:` block renders a `band_mode:` — for RISC-V.
    #
    # Only when something that can change the firmware changed: a cold
    # build downloads about 2 GB of ESP-IDF and toolchain per
    # instruction set, and the unit tests already gate every commit.
    if: >
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'firmware')
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: esp32
            arch: xtensa
          - board: esp32c5
            arch: riscv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Per board: two legs sharing one key would race to save the same
      # cache. Keyed on what goes into the image, so a change to the
      # ESPHome pin or the component rebuilds from scratch.
      - name: Cache the toolchain and framework
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.board }}-radar-${{ hashFiles('echolot/app/requirements.txt', 'echolot/app/builder.py', 'echolot/app/esphome_components/**') }}
      - name: Install dependencies
        run: pip install -r echolot/app/requirements.txt
      - name: Compile ${{ matrix.board }}
        run: python echolot/tools/compile_firmware.py ${{ matrix.board }}
        timeout-minutes: 60
